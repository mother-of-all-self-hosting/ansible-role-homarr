---
- name: Verify Homarr
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Verify that Homarr works
      block:
        - name: Run the shared Homarr verification tasks
          ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"
      rescue:
        # Whatever went wrong, the reason is almost always in the service log,
        # and nobody reading a failed CI run has a container left to look in.
        - name: Retrieve the Homarr service log
          ansible.builtin.command:
            cmd: journalctl --no-pager -xeu homarr.service
          register: homarr_service_log
          changed_when: false

        - name: Show the Homarr service log
          ansible.builtin.debug:
            var: homarr_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Homarr verification failed. The service log is printed above."
