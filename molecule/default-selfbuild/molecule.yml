---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: homarr-${MOLECULE_DISTRO:-ubuntu2604}-default-selfbuild
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Variables for Homarr
        homarr_uid: 1000
        homarr_gid: 1000
        homarr_scheme: http
        homarr_hostname: localhost
        homarr_container_labels_traefik_enabled: false
        homarr_container_http_host_bind_port: 7575
        # Throwaway, and only ever reachable from inside the Molecule container.
        # Homarr insists on exactly 64 hexadecimal characters; see the guard in
        # tasks/validate_config.yml.
        homarr_environment_variables_secret_encryption_key: 24d1a8bd7e87ce6d01d21bf5ef37a3574d6b1a0622f8641fc4da394ecba0c389
        homarr_database_type: sqlite
        # Deliberately not the name Homarr picks for itself (db.sqlite), so that
        # verify.yml can tell a setting which reached the container from one
        # which merely looks like it did.
        homarr_database_url: /appdata/molecule-homarr.sqlite

        # The role's own defaults, spelled out because verify.yml needs the
        # host-side data directory and cannot resolve a default which is
        # written in terms of another variable.
        homarr_base_path: /homarr
        homarr_data_path: /homarr/data

        # Variables for the verification suite
        homarr_molecule_base_url: http://127.0.0.1:7575
        homarr_molecule_admin_username: molecule
        homarr_molecule_admin_password: molecule-first-administrator
        homarr_molecule_board_name: molecule-round-trip

        # Test self-building
        homarr_container_image_self_build: true
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
