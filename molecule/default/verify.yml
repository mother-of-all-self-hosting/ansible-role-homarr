---
- name: Verify Homarr
  hosts: all
  become: true
  gather_facts: false

  vars:
    homarr_verify_units:
      - homarr.service

  tasks:
    - name: Verify that Homarr works
      block:
        - name: Run the shared Homarr verification tasks
          ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"
      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Homarr systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=homarr.service
          register: homarr_service_log
          changed_when: false

        - name: Show the Homarr systemd service log
          ansible.builtin.debug:
            var: homarr_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Homarr verification failed. The systemd service log is printed above."
